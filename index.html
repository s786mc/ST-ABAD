<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIR NEX | سایت رسمی</title>
<link rel="stylesheet" href="./FontStyle.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #ffd900;
            color: #111;
            min-height: 100vh;
        }

        .container {
            width: min(100% - 32px, 900px);
            margin: auto;
        }

        header {
            padding: 24px 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .profile {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .profile-image {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #111;
            background: #fff;
            margin-bottom: 20px;
        }

        .profile h1 {
            font-size: clamp(38px, 9vw, 72px);
            font-weight: 900;
            direction: ltr;
            letter-spacing: 2px;
        }

        .profile p {
            font-size: 18px;
            font-weight: 700;
            margin-top: 12px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 650px;
            margin: 35px auto 0;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 65px;
            padding: 15px;
            background: #111;
            color: #ffd900;
            text-decoration: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 800;
            transition: 0.2s ease;
        }

        .button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 0 #fff;
        }

        .about {
            margin: 30px auto;
            padding: 25px;
            max-width: 650px;
            background: #fff;
            border: 4px solid #111;
            border-radius: 20px;
            text-align: center;
        }

        .about h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .about p {
            line-height: 2;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 30px 0 20px;
            font-size: 14px;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .buttons {
                grid-template-columns: 1fr;
            }

            .profile {
                padding-top: 35px;
            }

            .profile-image {
                width: 110px;
                height: 110px;
            }

            .button {
                min-height: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <nav>
                <div class="brand">AMIR NEX</div>
            </nav>
        </header>

        <main>

            <section class="profile">
                <img src="logo.png" alt="AMIR NEX" class="profile-image">

                <h1>AMIR NEX</h1>

                <p>سایت رسمی امیر نکس</p>

                <div class="buttons">

                    <a href="https://www.youtube.com/@amir_nexuse" class="button">
                        ▶️ کانال یوتیوب
                    </a>

                    <a href="mini-game.html" class="button">
                        🎮 مینی گیم
                    </a>

                    <a href="posts/" class="button">
                        📝 پست‌ها
                    </a>

                    <a href="files/" class="button">
                        📁 فایل‌ها
                    </a>

                </div>
            </section>

            <section class="about">
                <h2>درباره من</h2>

                <p>
                    به سایت رسمی AMIR NEX خوش آمدید!
                    اینجا می‌توانید ویدئوها، پست‌ها، فایل‌ها
                    و مینی‌گیم‌های من را دنبال کنید.
                </p>
            </section>

        </main>

        <footer>
            © 2026 AMIR NEX
        </footer>

    </div>

</body>
</html>
