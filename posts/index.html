<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پست‌ها | AMIR NEX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #ffd900;
            color: #111;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: min(100%, 800px);
            margin: auto;
        }

        header {
            padding: 15px 0 30px;
        }

        .back {
            color: #111;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
        }

        .title {
            text-align: center;
            padding: 25px 0 35px;
        }

        .title h1 {
            font-size: clamp(38px, 9vw, 60px);
            font-weight: 900;
        }

        .title p {
            margin-top: 10px;
            font-weight: 700;
        }

        .post {
            background: #fff;
            border: 4px solid #111;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 7px 0 #111;
        }

        .post h2 {
            font-size: 23px;
            margin-bottom: 10px;
        }

        .date {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.6;
            margin-bottom: 15px;
        }

        .post p {
            line-height: 2;
            font-size: 16px;
            font-weight: 600;
            white-space: pre-line;
        }

        .empty {
            background: #fff;
            border: 4px solid #111;
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            font-weight: 800;
        }

        footer {
            text-align: center;
            padding: 35px 0 15px;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <a href="../index.html" class="back">← برگشت به صفحه اصلی</a>
        </header>

        <section class="title">
            <h1>📝 پست‌ها</h1>
            <p>آخرین نوشته‌های AMIR NEX</p>
        </section>

        <main>

            <article class="post">
                <h2>به سایت رسمی AMIR NEX خوش اومدید! 👋</h2>

                <div class="date">
                    ۲۶ مرداد ۱۴۰۵
                </div>

                <p>سلام! به سایت رسمی AMIR NEX خوش اومدید.
اینجا قراره اخبار، اطلاعیه‌ها و نوشته‌های جدیدم رو قرار بدم.</p>
            </article>

            <div class="empty">
                🚀 پست‌های بیشتری به‌زودی منتشر می‌شوند!
            </div>

        </main>

        <footer>
            © 2026 AMIR NEX
        </footer>

    </div>

</body>
</html>
